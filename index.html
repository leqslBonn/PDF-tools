<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Toolkit</title>
  <meta name="description" content="รวมเครื่องมือ PDF ครบในที่เดียว สแกน รวม แยก แปลง ปรับแต่ง ป้องกัน และเซ็นเอกสาร ทำงานในเบราว์เซอร์ ไฟล์ไม่ถูกส่งขึ้นเซิร์ฟเวอร์">
  <link rel="stylesheet" href="css/fonts.css">
  <!-- Preload every tool module so all tools keep working if the connection drops after the page opens. -->
  <link rel="modulepreload" href="js/lib.js">
  <link rel="modulepreload" href="js/editor.js">
  <link rel="modulepreload" href="js/scan-core.js">
  <link rel="modulepreload" href="js/tools/scan.js">
  <link rel="modulepreload" href="js/tools/merge.js">
  <link rel="modulepreload" href="js/tools/organize.js">
  <link rel="modulepreload" href="js/tools/split.js">
  <link rel="modulepreload" href="js/tools/compress.js">
  <link rel="modulepreload" href="js/tools/image.js">
  <link rel="modulepreload" href="js/tools/image-compress.js">
  <link rel="modulepreload" href="js/tools/jpg-to-pdf.js">
  <link rel="modulepreload" href="js/tools/page-number.js">
  <link rel="modulepreload" href="js/tools/watermark.js">
  <link rel="modulepreload" href="js/tools/crop.js">
  <link rel="modulepreload" href="js/tools/protect.js">
  <link rel="modulepreload" href="js/tools/sign.js">
  <link rel="modulepreload" href="js/tools/form.js">
  <meta name="theme-color" content="#f6f4fe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0b1a" media="(prefers-color-scheme: dark)">
  <script>try { var t = localStorage.getItem('pdftk-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23a21caf'/%3E%3Ctext x='16' y='21' font-size='11' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EPDF%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <div class="brand-logo">PDF</div>
      <div>
        <div class="brand-name">PDF Toolkit</div>
        <div class="brand-sub">เครื่องมือจัดการเอกสาร PDF</div>
      </div>
    </a>
    <div class="top-actions">
      <button class="btn theme-btn" id="themeBtn" type="button" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด"><span class="ic-light">🌙</span><span class="ic-dark">☀️</span></button>
      <a class="btn home-btn" href="#/" title="หน้าแรก" aria-label="หน้าแรก">🏠<span class="lbl">หน้าแรก</span></a>
    </div>
  </header>

  <main class="wrap" id="app"></main>
  <footer>ประมวลผลทั้งหมดในเบราว์เซอร์ของคุณ · ไฟล์ไม่ถูกอัปโหลดไปที่ใด<br>ทำด้วย <span class="heart">♥</span> ให้ทุกคนที่ต้องจัดการเอกสาร</footer>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/pako.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
